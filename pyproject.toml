[project]
name = "routee-autoresearch"
version = "0.1.0"
description = "Autonomous research swarm for RouteE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.6.0",
    "torch==2.9.1",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
routee-autoresearch = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.13.*"
ipykernel = ">=7.2.0,<8"
mypy = ">=1.19.1,<2"
pip = ">=26.0.1,<27"
