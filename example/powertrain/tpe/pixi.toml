[workspace]
name = "routee-autoresearch-baseline"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "linux-64"]
version = "0.1.0"

[tasks]
search = "python search.py"

[dependencies]
python = "3.13.*"
numpy = ">=2.0,<3"
pandas = ">=3.0,<4"
pyarrow = ">=23.0,<24"
scikit-learn = ">=1.8,<2"
pytorch = ">=2.0,<3"
shapely = ">=2.0,<3"
optuna = ">=3.0,<5"
xgboost = ">=2.0,<3"
lightgbm = ">=4.0,<5"
